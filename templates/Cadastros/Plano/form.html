<form action="" id="formDadosPlanoSaude" method="post" role="form" class="classPlanoSaude">
    <div class="modal-body" id="corpo">
        <input id="id_id" name="id" hidden>
        <div class="form-group col-md-12 has-warning">
            <label for="id_descricao">Nome do plano</label>
            <input id="id_descricao" name="descricao" type="text" value=""
                   class="form-control text-uppercase" required="required">
        </div>
        <div class="form-group col-md-12 has-warning">
            <label for="id_fk_convenio">Convênio</label>
            <select id="id_fk_convenio" name="fk_convenio" class="form-control input-sm" >
                {% for c in lista_convenios %}
                    <option {% if c.id == plano.fk_convenio.id %}selected{% endif %} value="{{ c.id }}">{{ c.convenio }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group col-md-12 has-warning">
            <label for="id_anotacoes">Anotações</label>
            <textarea id="id_anotacoes" name="anotacoes" rows="3" class="form-control"></textarea>
        </div>
    </div>
</form>
<div class="form-group col-md-12 col-lg-12 text-right">
    <div class="hr-line-solid"></div>
    <div class="col-md-6 text-left">
        <a id="botao_novo_plano" class="btn btn-primary" onclick="addPlano()"><i class="fa fa-pencil"></i> Novo</a>
    </div>
    <div class="col-md-6 text-right">
        <a id="btnSalvaPlano" class="btn btn-primary" onclick="SavePlano()"><i class="fa fa-save"></i> Salvar</a>
    </div>
</div>
