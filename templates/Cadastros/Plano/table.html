<div class="col-md-7 col-lg-7">
    <div class="cad-card cad-lista">
        <div class="cad-card-topo">
            <h3><i class="fa fa-list-ul" aria-hidden="true"></i> Planos cadastrados <span class="cad-contador" data-cad-contador>0</span></h3>
        </div>
        <table id="tabelaPlanosSaude"
               data-toggle="table"
               data-classes="table table-hover table-no-bordered"
               data-row-style="rowStyle"
               data-click-to-select="true"
               data-search="true"
               data-height="560"
               data-unique-id="id"
               data-url="/cadastros/planos/CarregaPlanosSaude/">
            <thead>
                <tr>
                    <th data-field="id" data-visible="false"></th>
                    <th data-field="descricao" class="cad-nome">Plano</th>
                    <th data-field="convenio">Convênio</th>
                    <th data-field="anotacoes" class="cad-discreto">Anotações</th>
                    <th data-field="edit" data-width="90" data-formatter="FormatoPlano" data-events="EventoPlano" data-align="right"></th>
                </tr>
            </thead>
        </table>
    </div>
</div>
<div id="id_TelaPlanox" class="col-md-5 col-lg-5">
    {% include 'Cadastros/Plano/form.html' %}
</div>
