<table id="tabelaMedico"
       data-toggle="table"
       data-classes="table table-hover table-no-bordered"
       data-row-style="rowStyleMed"
       data-click-to-select="true"
       data-search="true"
       data-height="640"
       data-unique-id="id"
       data-url="/cadastros/medicos/PesquisarDentistas">
    <thead>
    <tr>
        <th data-field="nome" class="cad-nome">Nome</th>
        <th data-field="id" data-visible="false">ID</th>
        <th data-field="Buttons" data-width="90" data-formatter="ButtonsMedico" data-events="EventsMedico" data-align="right"></th>
    </tr>
    </thead>
</table>
