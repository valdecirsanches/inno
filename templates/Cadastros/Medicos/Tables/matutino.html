<div class="table-responsive">
    <table id="tabelaHorariosMatutino"
           data-toggle="table"
           data-classes="table table-condensed table-hover table-no-bordered"
           data-row-style="rowStyle"
           data-unique-id="id"
           data-url="/cadastros/medicos/CarregarHorarios/">
        <thead>
            <tr class="bg-default">
                <th data-field="id" data-visible="false"></th>
                <th data-field="periodo" data-visible="false"></th>
                <th data-field="hr" data-align="center">Horário (Matutino)</th>
                <th data-field="excluir" data-formatter="FormatoExcluirHorario" data-events="EventoExcluirHorario" data-align="center"><i class="fa fa-trash-o"></i></th>
            </tr>
        </thead>
    </table>
</div>
