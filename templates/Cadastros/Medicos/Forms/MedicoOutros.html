<form action="" id="formMedicoOutros" method="post" role="form" class="classMedico">
    <div class="row">
        <div class="form-group col-md-2">
            <label for="id_inicio">Início da atividade</label>
            <input id="id_inicio" name="inicio" type="date" class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="id_termino">Término da atividade</label>
            <input id="id_termino" name="termino" type="date" class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="id_especialidade">Especialidade</label>
            <input id="id_especialidade" name="especialidade" type="text" class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="id_titulo">Titulo</label>
            <input id="id_titulo" name="titulo" type="text" class="form-control">
        </div>
        <div class="form-group col-md-2">
            <label for="id_ativo">Status</label>
            <select id="id_ativo" name="ativo" class="form-control">
                <option value="True">ATIVO</option>
                <option value="False">INATIVO</option>
            </select>
        </div>
        <div class="form-group col-md-2">
            <label for="id_clinicas_que_atende">Clinicas que atende</label>
            <input id="id_clinicas_que_atende" name="clinicas_que_atende" type="text" class="form-control">
        </div>
        <div class="form-group col-md-12">
            <label for="id_cabecalho">Cabeçalho</label>
            <textarea id="id_cabecalho" name="cabecalho" rows="3" class="form-control"></textarea>
        </div>
        <div class="form-group col-md-12">
            <label for="id_anotacoes">Anotações</label>
            <textarea id="id_anotacoes" name="anotacoes" rows="3" class="form-control"></textarea>
        </div>

    </div>
</form>
