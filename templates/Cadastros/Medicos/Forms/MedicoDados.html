<form action="" id="formMedicoDados" method="post" role="form" class="classMedico form-horizontal">

    <div class="row">
        <div class="form-group">
            <div class="col-md-7 col-sm-7">
                <input type="text" id="id_id" name="id">
                <label for="id_medico">Nome</label>
                <input id="id_medico" name="medico" type="text"
                       class="form-control" required="required">
            </div>
            <div class="col-md-2">
                <label for="id_codigo">Código</label>
                <input id="id_codigo" name="codigo" type="text"
                       class="form-control text-uppercase" required="required">
            </div>
            <div class="col-md-2 col-sm-3">
                <label for="id_crm">CRM</label>
                <input id="id_crm" name="crm" type="text" class="form-control">
            </div>
            <div class="col-md-1 col-sm-2">
                <label for="id_crm_uf">UF</label>
                <input id="id_crm_uf" name="crm_uf" type="text" class="form-control">
            </div>
            <div class="col-md-3 col-sm-4">
                <label for="id_telefone">Telefone</label>
                <input id="id_telefone" name="telefone" type="text" class="form-control celular">
            </div>
            <div class="col-md-3 col-sm-4">
                <label for="id_celular">Celular</label>
                <input id="id_celular" name="celular" type="text" class="form-control celular">
            </div>
            <div class="col-md-9 col-sm-9">
                <label for="id_email">email</label>
                <input id="id_email" name="email" type="email" class="form-control text-lowercase">
            </div>
            <div id="id_cpf_div" class="col-md-3 col-sm-4">
                <label for="id_cpf">CPF</label>
                <input id="id_cpf" name="cpf" type="text" class="form-control cpf">
            </div>
        </div>
    </div>
</form>
