<div class="col-md-7 col-lg-7">
    <div class="cad-card cad-lista">
        <div class="cad-card-topo">
            <h3><i class="fa fa-list-ul" aria-hidden="true"></i> Especialidades cadastradas <span class="cad-contador" data-cad-contador>0</span></h3>
        </div>
        <table id="tabelaEspecialidade"
               data-toggle="table"
               data-classes="table table-hover table-no-bordered"
               data-row-style="rowStyle"
               data-click-to-select="true"
               data-height="520"
               data-unique-id="id"
               data-search="true"
               data-url="/cadastros/especialidades/CarregaEspecialidades/">
            <thead>
            <tr>
                <th data-field="id" data-visible="false"></th>
                <th data-field="nome" class="cad-nome">Especialidade</th>
                <th data-field="grupo" class="cad-discreto">Grupo</th>
                <th data-field="espcialidade" data-formatter="FormatoEspecialidade" data-events="EventoEspecialidade" data-align="right" data-width="90"></th>
            </tr>
            </thead>
        </table>
    </div>
</div>
<div id="id_TelaEspecialidadex" class="col-md-5 col-lg-5">
    {% include 'Cadastros/Especialidades/form.html' %}
</div>
