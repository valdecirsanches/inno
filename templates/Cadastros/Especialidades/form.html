<div class="cad-card">
    <div class="cad-card-topo">
        <h3><i class="fa fa-pencil-square-o" aria-hidden="true"></i> <span class="cad-titulo-texto" data-cad-titulo="Nova especialidade">Nova especialidade</span></h3>
        <span class="cad-estado" data-cad-estado>Novo cadastro</span>
    </div>
    <form id="formDadosEspecialidade" action="" method="post" role="form" class="classEspecialidade">
        <div class="cad-form-corpo" id="corpo">
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-tag" aria-hidden="true"></i>
                    <h4>Identificação<small>Como a especialidade aparece na agenda e nos impressos.</small></h4>
                </div>
                <div class="row">
                    <div class="form-group col-sm-5">
                        <input id="id_id" class="hidden">
                        <label for="id_grupo">Grupo</label>
                        <input id="id_grupo" name="grupo" type="text" value="" placeholder="Ex.: CLÍNICA"
                               class="form-control" required="required" style="text-transform: uppercase;">
                    </div>
                    <div class="form-group col-sm-12">
                        <label for="id_nome">Nome da especialidade</label>
                        <input id="id_nome" name="nome" type="text" value="" placeholder="Ex.: CARDIOLOGIA"
                               class="form-control" required="required" style="text-transform: uppercase;">
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="cad-card-rodape">
        <a id="btnAddEspecialidade" class="cad-btn cad-btn-secundario" data-cad-novo data-cad-limpa onclick="addEspecialidade()"><i class="fa fa-plus"></i> <span class="cad-btn-rotulo">Novo</span></a>
        <a id="btnSalvaEspecialidade" class="cad-btn cad-btn-primario" data-cad-salvar onclick="SalvaEspecialidade()" title="Salvar (Ctrl+S)"><i class="fa fa-check"></i> <span class="cad-btn-rotulo">Salvar</span> <kbd>Ctrl S</kbd></a>
    </div>
</div>
