<table id="tabelaPlanosSaude"
       data-toggle="table"
       data-classes="table table-condensed table-hover table-no-bordered"
       data-row-style="rowStyle"
       data-height="550"
       data-unique-id="id"
       data-url="/cadastros/planos/CarregaPlanosSaude/">
    <thead>
        <tr>
            <th data-field="id"></th>
            <th data-field="descricao">Nome do Plano de saúde</th>
            <th data-field="convenio">Convenio</th>
            <th data-field="anotacoes">Anotações</th>
            <th data-field="edit" data-formatter="FormatoEdit" data-events="EventoEdit" data-align="center">Editar</th>
            <th data-field="del" data-formatter="FormatoDel" data-events="EventoDel" data-align="center">Excluir</th>
        </tr>
    </thead>
</table>
