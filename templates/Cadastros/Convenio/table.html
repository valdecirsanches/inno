<table id="tabelaConvenio"
       data-toggle="table"
       data-classes="table table-hover table-no-bordered"
       data-row-style="rowStyle"
       data-click-to-select="true"
       data-search="true"
       data-height="640"
       data-unique-id="id"
       data-url="/cadastros/convenio/convenio.json">
    <thead>
    <tr>
        <th data-field="id" data-visible="false"></th>
        <th data-field="convenio" class="cad-nome">Convênio</th>
        <th data-field="edit"
            data-width="90"
            data-formatter="OpcoesConvenio"
            data-events="EventsConvenio"
            data-align="right">
        </th>
    </tr>
    </thead>
</table>
