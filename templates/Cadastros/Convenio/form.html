<div class="cad-card">
    <div class="cad-card-topo">
        <h3><i class="fa fa-pencil-square-o" aria-hidden="true"></i> <span class="cad-titulo-texto" data-cad-titulo="Novo convênio">Novo convênio</span></h3>
        <span class="cad-estado" data-cad-estado>Novo cadastro</span>
    </div>
    <form method="post" role="form" id="formDadosConvenio" class="classConvenio">
        <div class="cad-form-corpo" id="corpo">
            <input id="id_id" name="id" class="hidden">
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-briefcase" aria-hidden="true"></i>
                    <h4>Identificação<small>Como o convênio aparece na agenda, nas guias e nos relatórios.</small></h4>
                </div>
                <div class="row">
                    <div class="form-group col-sm-3" id="codigo_div">
                        <label for="id_codigo">Código</label>
                        <input id="id_codigo" name="codigo" type="text" class="form-control" value="" placeholder="Ex.: 001">
                    </div>
                    <div class="form-group col-sm-9" id="nome_div">
                        <label for="id_convenio">Nome do convênio</label>
                        <input id="id_convenio" name="convenio" type="text" class="form-control" value="" placeholder="Nome usado no dia a dia">
                    </div>
                    <div class="form-group col-sm-8" id="razao_div">
                        <label for="id_razao">Razão social</label>
                        <input id="id_razao" name="razao" type="text" class="form-control" value="" placeholder="Como consta no CNPJ">
                    </div>
                    <div class="form-group col-sm-4" id="cnpj_div">
                        <label for="id_cnpj">CNPJ</label>
                        <input id="id_cnpj" name="cnpj" type="text" class="form-control" value="" placeholder="00.000.000/0000-00">
                    </div>
                </div>
            </div>
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-map-marker" aria-hidden="true"></i>
                    <h4>Endereço<small>Digite o CEP e clique na lupa para preencher o resto.</small></h4>
                </div>
                <div class="row">
                    <div class="form-group col-sm-3">
                        <label for="id_cep">CEP</label>
                        <div class="input-group">
                            <input id="id_cep" name="cep" type="text" maxlength="9" data-mask="99999-999"
                                   class="form-control" placeholder="00000-000" value="{% if p.cep %}{{ p.cep }}{% endif %}">
                            <div class="input-group-addon btn" id="btn_busca_id" onclick="ValidarCEP()" title="Buscar endereço pelo CEP">
                                <span class="glyphicon glyphicon-search"></span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group col-sm-7" id="rua_div">
                        <label for="id_endereco">Endereço</label>
                        <input id="id_endereco" name="endereco" type="text" class="form-control" value="" placeholder="Rua, avenida…">
                    </div>
                    <div class="form-group col-sm-2" id="numero_div">
                        <label for="id_numero">Número</label>
                        <input id="id_numero" name="numero" type="text" class="form-control" value="" placeholder="Nº">
                    </div>
                    <div class="form-group col-sm-5" id="bairro_div">
                        <label for="id_bairro">Bairro</label>
                        <input id="id_bairro" name="bairro" type="text" class="form-control" value="" placeholder="Bairro">
                    </div>
                    <div class="form-group col-sm-5" id="cidade_div">
                        <label for="id_cidade">Cidade</label>
                        <input id="id_cidade" name="cidade" type="text" class="form-control" value="" placeholder="Cidade">
                    </div>
                    <div class="form-group col-sm-2" id="uf_div">
                        <label for="id_uf">UF</label>
                        <input id="id_uf" name="uf" type="text" class="form-control text-uppercase" value="" placeholder="UF" maxlength="2">
                    </div>
                </div>
            </div>
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-phone" aria-hidden="true"></i>
                    <h4>Contato</h4>
                </div>
                <div class="row">
                    <div class="form-group col-sm-4" id="telefone_div">
                        <label for="id_telefone">Telefone</label>
                        <input id="id_telefone" name="telefone" type="text" class="form-control" value="" placeholder="(00) 0000-0000">
                    </div>
                    <div class="form-group col-sm-8" id="email_div">
                        <label for="id_email">E-mail</label>
                        <input id="id_email" name="email" type="email" class="form-control" value="" placeholder="contato@convenio.com.br">
                    </div>
                </div>
            </div>
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-file-text-o" aria-hidden="true"></i>
                    <h4>Observações<small>Anotações internas e comentários sobre o convênio.</small></h4>
                </div>
                <div class="row">
                    <div class="form-group col-sm-6" id="anotacoes_div">
                        <label for="id_anotacoes">Anotações</label>
                        <textarea id="id_anotacoes" name="anotacoes" class="form-control" rows="3" placeholder="Prazos, regras de autorização…"></textarea>
                    </div>
                    <div class="form-group col-sm-6" id="comentario_div">
                        <label for="id_comentario">Comentários</label>
                        <textarea id="id_comentario" name="comentario" class="form-control" rows="3" placeholder="Outras observações…"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="cad-card-rodape">
        <a id="botao_novo_plano" class="cad-btn cad-btn-secundario" data-cad-novo onclick="AddConvenio()"><i class="fa fa-plus"></i> <span class="cad-btn-rotulo">Novo</span></a>
        <a id="btnSalvaConvenio" class="cad-btn cad-btn-primario" data-cad-salvar onclick="SalvaConvenio()" title="Salvar (Ctrl+S)"><i class="fa fa-check"></i> <span class="cad-btn-rotulo">Salvar</span> <kbd>Ctrl S</kbd></a>
    </div>
</div>
