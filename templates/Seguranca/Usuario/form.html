<form action="" method="post" role="form"  id="formUsuarioDados" class="classUsuario">
    <div class="modal-body" id="corpo">
        <input id="id_id" name="id" type="number" class="form-control hidden" readonly>

        <div id="id_login_div" class="form-group col-md-4 col-lg-4">
            <label for="id_login">Login</label>
            <input id="id_login" name="login" type="text" class="form-control">
        </div>
        <div id="id_cpf_div" class="form-group col-md-4  col-lg-4">
            <label for="id_cpf">CPF</label>
            <input id="id_cpf" name="cpf" type="text" class="form-control cpf">
        </div>
        <div id="id_administrador_div" class="form-group col-md-4 col-lg-4">
            <label for="id_administrador">Administrador</label>
            <select id="id_administrador" name="administrador" class="form-control" required="required">
                <option value="True">Sim</option>
                <option value="False">Não</option>
            </select>
        </div>
        <div id="id_first_name_div" class="form-group col-md-12 col-lg-12">
            <label for="id_first_name">Nome completo</label>
            <input id="id_first_name" name="first_name" type="text" class="form-control">
        </div>


        <div id="id_email_div" class="form-group col-md-12 col-lg-12">
            <label for="id_email">Email</label>
            <input id="id_email" name="email" type="text" class="form-control email">
        </div>
        <div id="id_fk_medico_div" class="form-group col-md-12">
            <label for="id_fk_medico">Médico</label>
            <select id="id_fk_medico" name="fk_medico" class="form-control">
                {% for m in medicos %}
                    <option {% if m.id == user.fk_medico.id %}selected{% endif %} value="{{ m.id }}">{{ m.medico }}</option>
                {% endfor %}

            </select>
        </div>

        <div id="id_fk_clinica_div" class="form-group col-md-12 col-lg-12">
            <label for="id_fk_clinica">Clinica</label>
            <select id="id_fk_clinica" name="fk_clinica" class="form-control" required="required">
                <option value="1">OSASCO</option>
                <option value="2">SÃO PAULO</option>
            </select>

        </div>

    </div>
</form>

<div class="form-group col-md-12 col-lg-12 text-right">
    <div class="hr-line-solid"></div>
    <div class="col-md-6 text-left">
        <a id="botao_novo_plano" class="btn btn-primary" onclick="addUsuario()"><i class="fa fa-pencil"></i> Novo</a>
    </div>
    <div class="col-md-6 text-right">
        <a id="btnSalvaPlano" class="btn btn-primary" onclick="SalvaUsuario()"><i class="fa fa-save"></i> Salvar</a>
    </div>
</div>
