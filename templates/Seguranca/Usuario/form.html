<div class="cad-card">
    <div class="cad-card-topo">
        <h3><i class="fa fa-pencil-square-o" aria-hidden="true"></i> <span class="cad-titulo-texto" data-cad-titulo="Novo usuário">Novo usuário</span></h3>
        <span class="cad-estado" data-cad-estado>Novo cadastro</span>
    </div>
    <form action="" method="post" role="form" id="formUsuarioDados" class="classUsuario">
        <div class="cad-form-corpo" id="corpo">
            <input id="id_id" name="id" type="number" class="form-control hidden" value="0" readonly>
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-user" aria-hidden="true"></i>
                    <h4>Pessoa<small>Identificação de quem vai usar o sistema.</small></h4>
                </div>
                <div class="row">
                    <div id="id_first_name_div" class="form-group col-sm-12">
                        <label for="id_first_name">Nome completo</label>
                        <input id="id_first_name" name="first_name" type="text" class="form-control" placeholder="Nome e sobrenome">
                    </div>
                    <div id="id_cpf_div" class="form-group col-sm-5">
                        <label for="id_cpf">CPF</label>
                        <input id="id_cpf" name="cpf" type="text" class="form-control cpf" placeholder="000.000.000-00">
                    </div>
                    <div id="id_email_div" class="form-group col-sm-7">
                        <label for="id_email">E-mail</label>
                        <input id="id_email" name="email" type="text" class="form-control email" placeholder="nome@clinica.com.br">
                    </div>
                </div>
            </div>
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <i class="fa fa-key" aria-hidden="true"></i>
                    <h4>Acesso<small>Login, perfil e onde a pessoa trabalha.</small></h4>
                </div>
                <div class="row">
                    <div id="id_login_div" class="form-group col-sm-7">
                        <label for="id_login">Login</label>
                        <input id="id_login" name="login" type="text" class="form-control" placeholder="Usuário para entrar">
                    </div>
                    <div id="id_administrador_div" class="form-group col-sm-5">
                        <label for="id_administrador">Administrador</label>
                        <select id="id_administrador" name="administrador" class="form-control" required="required">
                            <option value="True">Sim</option>
                            <option value="False">Não</option>
                        </select>
                    </div>
                    <div id="id_fk_clinica_div" class="form-group col-sm-12">
                        <label for="id_fk_clinica">Clínica</label>
                        <select id="id_fk_clinica" name="fk_clinica" class="form-control" required="required">
                            <option value="1">OSASCO</option>
                            <option value="2">SÃO PAULO</option>
                        </select>
                    </div>
                    <div id="id_fk_medico_div" class="form-group col-sm-12">
                        <label for="id_fk_medico">Médico vinculado</label>
                        <select id="id_fk_medico" name="fk_medico" class="form-control">
                            {% for m in medicos %}
                                <option {% if m.id == user.fk_medico.id %}selected{% endif %} value="{{ m.id }}">{{ m.medico }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="cad-card-rodape">
        <a id="botao_novo_plano" class="cad-btn cad-btn-secundario" data-cad-novo onclick="AddUsuario(); $('.classUsuario #id_id').val(0);"><i class="fa fa-plus"></i> <span class="cad-btn-rotulo">Novo</span></a>
        <div class="cad-card-acoes">
            {% if user.administrador == 'True' or user.is_superuser %}
            <a id="btnRedefineSenha" class="cad-btn cad-btn-secundario" data-cad-so-edicao style="display: none" onclick="RedefineSenha()" title="Definir uma senha nova para este usuário"><i class="fa fa-key"></i> <span class="cad-btn-rotulo">Redefinir senha</span></a>
            {% endif %}
            <a id="btnSalvaPlano" class="cad-btn cad-btn-primario" data-cad-salvar onclick="SalvaUsuario()" title="Salvar (Ctrl+S)"><i class="fa fa-check"></i> <span class="cad-btn-rotulo">Salvar</span> <kbd>Ctrl S</kbd></a>
        </div>
    </div>
</div>
