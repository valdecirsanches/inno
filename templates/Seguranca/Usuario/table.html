<div class="col-md-7 col-lg-7">
    <div class="cad-card cad-lista">
        <div class="cad-card-topo">
            <h3><i class="fa fa-list-ul" aria-hidden="true"></i> Usuários <span class="cad-contador" data-cad-contador>0</span></h3>
        </div>
        <table id="tabelaUsuario"
               data-toggle="table"
               data-classes="table table-hover table-no-bordered"
               data-search="true"
               data-height="560"
               data-url="/seguranca/usuario.json/">
            <thead>
            <tr>
                <th data-field="id" data-visible="false">ID</th>
                <th data-field="first_name" class="cad-nome">Nome</th>
                <th data-field="login" class="cad-discreto">Login</th>
                <th data-field="clinica">Clínica</th>
                <th data-field="operate" data-width="90" data-align="right" data-formatter="FormatoUsuario" data-events="EventoUsuario"></th>
            </tr>
            </thead>
        </table>
    </div>
</div>
<div id="id_TelaUsuariox" class="col-md-5 col-lg-5">
    {% include 'Seguranca/Usuario/form.html' %}
</div>
