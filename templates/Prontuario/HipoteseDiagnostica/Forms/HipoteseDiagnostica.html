<div class="ibox-content">
    <H1>Hipótese diagnóstica</H1>
    <form method="post" role="form" id="formHipoteseDiagnostica" class="formAutoSave classHipoteseDiagnostica"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <input id="id_id_hipotese_diagnostica" name="id" type="hidden" value="0">
        <div class="row">

            <input id="id_fk_prontuario" name="fk_prontuario" type="hidden">
            <input id="id_fk_consulta" name="fk_consulta" type="hidden">
            <input id="id_fk_medico" name="fk_medico" type="hidden">

            <div id="id_diagnostico_div" class="form-group col-md-6">
                <label for="id_diagnostico">Diagnóstico principal</label>
                <select
                        id="id_diagnostico"
                        name="diagnostico"
                        class="form-control select_CID10 js-example-basic-multiple treta save_diagnostico"
                        data-format="formatRepoSelectionCID10"
                        data-change="changeCID10"
                        multiple="multiple"
                >
                </select>
            </div>
            <div id="id_outros_diagnosticos_div" class="form-group col-md-6">
                <label for="id_outros_diagnosticos">Outros diagnósticos</label>
                <select
                        id="id_outros_diagnosticos"
                        name="outros_diagnosticos"
                        class="form-control select_CID10 js-example-basic-multiple treta save_diagnostico"
                        data-format="formatRepoSelectionCID10"
                        data-change="changeCID10"
                        multiple="multiple"
                >
                </select>
            </div>
            <div id="id_obs_diagnostico_div" class="form-group col-md-12">
                <label for="id_obs_diagnostico">Observações</label>
                <textarea id="id_obs_diagnostico"
                          name="obs_diagnostico"
                          class="form-control treta save_diagnostico"
                          cols="75"
                          rows="2"></textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <div class="form-group">
            <a>Salvo em <strong id="data_hipotese_diagnostica"></strong></a>
            <div class="pull-right">
                {# <a id="SalvaHipoteseDiagnostica" class="btn btn-success btn-outline btnAutoSave"
                   onclick="saveHipoteseDiagnostica()"><i class="fa fa-save"></i> Salvar</a> #}
            </div>
        </div>
        <div id="id_ultima_hipotese_diagnostica">

        </div>
    </form>
</div>
