<table id="tabelaConfRelatorios"
       data-toggle="table"
       data-classes="table table-condensed table-hover table-no-bordered"
       data-click-to-select="true"
       data-search="true"
       data-unique-id="id"
       data-url="/configuracoes/relatorios/CarregaConfRelatorios/">
    <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="nome" data-editable-placement="right">Tipo Exame</th>
            <th data-field="titulo" data-editable-placement="right">Titulo</th>
            <th data-field="data_salvo" data-editable-placement="right">Data</th>
            <th data-field="edit" class="col-md-2" data-formatter="OptionsConfRelatorio" data-events="EventsConfRelatorio" data-align="center"></th>
        </tr>
    </thead>
</table>
