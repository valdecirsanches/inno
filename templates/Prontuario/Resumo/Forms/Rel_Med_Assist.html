
<h4 id="dataRelatorio"></h4>
<h1> Relatório Médico Assistencial</h1>
<div class="row">
    <form id="formRelatorio">
        <div id="id_queixa_rel_div" class="form-group col-md-12">
            <label for="id_queixa_rel">Queixa:</label>
            <textarea id="id_queixa_rel" name="queixa" class="form-control" rows="4"></textarea>
        </div>
        <div id="id_historico_rel_div" class="form-group col-md-12">
            <label for="id_historico_rel">Histórico</label>
            <textarea id="id_historico_rel" name="historico" class="form-control" rows="4"></textarea>
        </div>
        <div id="id_receituario_rel_div" class="form-group col-md-12">
            <label for="id_receituario_rel">Receituário</label>
            <textarea id="id_receituario_rel" name="receituario" class="form-control" rows="4"></textarea>
        </div>
        <div id="id_evolucao_rel_div" class="form-group col-md-12">
            <label for="id_evolucao_rel">Evolução</label>
            <textarea id="id_evolucao_rel" name="evolucao" class="form-control" rows="4"></textarea>
        </div>
        <div id="id_laudos_rel_div" class="form-group col-md-12">
            <label for="id_laudos_rel">Laudos</label>
            <textarea id="id_laudos_rel" name="laudos" class="form-control" rows="4"></textarea>
        </div>
        <div id="id_pedido_rel_div" class="form-group col-md-12">
            <label for="id_pedido_rel">Pedido do Dr(a)</label>
            <textarea id="id_pedido_rel" name="pedido" class="form-control" rows="4"></textarea>
        </div>
    </form>
    <div class="text-right">
        <a class="btn btn-default" onclick="ImprimeRelatorio()"><i class="fa fa-print"></i> Imprimir relatório</a>
    </div>
</div>
