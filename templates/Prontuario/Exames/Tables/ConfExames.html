<table id="tabelaConfExames"
       data-toggle="table"
       data-classes="table table-condensed table-hover table-no-bordered"
       data-click-to-select="true"
       data-search="true"
       data-unique-id="id"
       data-url="/configuracoes/exames/CarregaConfExames/">
    <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="nome" data-editable-placement="right">Tipo Exame</th>
            <th data-field="descricao" data-editable-placement="right">Descrição</th>
            <th data-field="data_salvo" data-editable-placement="right">Data</th>
            <th data-field="edit" class="col-md-2" data-formatter="OptionConfExame" data-events="EventsConfExame" data-align="center"></th>
        </tr>
    </thead>
</table>
