<table id="tabelaRelatorios"
       data-toggle="table"
       data-classes="table table-no-bordered"
       data-url="/configuracoes/relatorios/CarregaConfRelatorios/">
    <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="edit" data-formatter="editFormatter" data-events="editRelatorioEvents" data-align="center"></th>
            <th data-field="nome" data-editable-placement="right">Tipo relatório</th>
            <th data-field="titulo" data-editable-placement="right">Titulo</th>
            <th data-field="data_salvo" data-editable-placement="right">Data</th>
            <th data-field="remove" data-formatter="excludeFormatter" data-events="excludeRelatorioEvents" data-align="center"></th>
        </tr>
    </thead>
</table>
