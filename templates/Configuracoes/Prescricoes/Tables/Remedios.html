<table id="tabelaPrescricaoRemedios"
       data-toggle="table"
       data-classes="table table-no-bordered"
       data-detail-view="true"
       data-detail-formatter="detailFormatter"
       data-unique-id="id"
       data-response-handler="respostaRemediosPadrao"
       data-query-params="paramsRemediosPadrao"
       data-url="/configuracoes/prescricoes/CarregarConfPrescricaoRemedios">
    <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="descricao" data-visible="false"></th>
            <th data-field="fk_prescricao_id" data-visible="false"></th>
            <th data-field="nome" data-editable-placement="right">Nome</th>
            <th data-field="tipo" data-editable-placement="right">Tipo</th>
            <th data-field="qtdade" data-editable-placement="right">Quantidade</th>
            <th data-field="unidade" data-editable-placement="right">Unidade</th>
            <th data-field="remove" data-formatter="excludeFormatter" data-events="excludeRemedioEvents" data-align="center"></th>
        </tr>
    </thead>
</table>
