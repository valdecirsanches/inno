<table id="tabelaExames"
       data-toggle="table"
       data-classes="table table-no-bordered"
       data-url="/configuracoes/exames/CarregaConfExames/">
    <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="edit" data-formatter="editFormatter" data-events="editExamesEvents" data-align="center"></th>
            <th data-field="nome" data-editable-placement="right">Tipo exame</th>
            <th data-field="descricao" data-editable-placement="right">Descrição</th>
            <th data-field="data_salvo" data-editable-placement="right">Data</th>
            <th data-field="remove" data-formatter="excludeFormatter" data-events="excludeExamesEvents" data-align="center"></th>
        </tr>
    </thead>
</table>
