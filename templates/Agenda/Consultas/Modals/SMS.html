<div class="modal inmodal" id="ModalSMS" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content animated fadeInUp">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span aria-hidden="true">&times;</span>
                    <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title">Envia LEMBRETE via SMS</h4>
            </div>
            <div class="modal-body" id="corpo">
                <form method="post" role="form" id="form_sms"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                    <div class="row">
                        <input type="text" class="hidden" id="agenda_sms_id" value="">
                        <input type="hidden" id="dia_semana">
                        <input type="hidden" id="destinatario_sms" value="">
                        <div class="form-group col-md-8">
                            <label for="destinatario_id">Destinatário</label>
                            <input id="destinatario_id" name="destinatario" type="text"
                                   class="form-control" value="">
                        </div>

                        <div class="form-group col-md-4">
                            <label for="celular_id">Celular</label>
                            <input id="celular_id" name="celular" type="text"
                                   class="form-control" required="required" autofocus="True" value="">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group col-md-12">
                            <label for="mensagem_sms_id">Mensagem</label>
                            <textarea id="mensagem_sms_id" name="mensagem_sms" class="form-control" rel="autosize" placeholder="Mensagem"
                                      required="required" onkeyup="javascript:this.value=this.value.toUpperCase();" >
                            </textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal">Desistir</button>
                <a class="btn btn-primary" onclick="EnviaSMS()"><i class="fa fa-comments"></i>  Enviar</a>
            </div>
        </div>
    </div>
</div>
